# Build and deploy the Nuxt SPA to the ERP hosting environments.
name: Build and deploy ERP static site

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      target:
        description: 'Куда развернуть сборку'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        run: echo "environment=${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.resolve-target.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run verify гоняет и тесты PHP-бэкенда (авторизация, сессии,
      # согласования, миграции). Проверяем интерпретатор заранее, чтобы
      # отсутствие PHP на раннере падало здесь с понятной причиной,
      # а не в середине verify.
      - name: Check PHP toolchain
        run: php --version

      - name: Verify application
        run: npm run verify

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_ERP_GAS_URL: ${{ secrets.NUXT_PUBLIC_ERP_GAS_URL || secrets.NUXT_PUBLIC_CRM_GAS_URL }}
          NUXT_PUBLIC_WAREHOUSE_GAS_URL: ${{ secrets.NUXT_PUBLIC_WAREHOUSE_GAS_URL }}
          # Режим бэкенда задаётся переменной окружения GitHub, а не хардкодом:
          # staging работает на SQL API, production пока на GAS. Без этого
          # любой деплой через CI молча возвращал staging на GAS, потому что
          # SQL-сборку туда выкладывали руками с локальными переменными.
          # Значение по умолчанию — gas: безопасный откат, если переменная
          # в окружении не задана.
          NUXT_PUBLIC_ERP_BACKEND_MODE: ${{ vars.ERP_BACKEND_MODE || 'gas' }}
          NUXT_PUBLIC_ERP_API_BASE: ${{ vars.ERP_API_BASE || '/api' }}
          # ID таблицы только из секретов окружения — в коде дефолтов больше нет.
          NUXT_PUBLIC_ERP_SPREADSHEET_ID: ${{ secrets.NUXT_PUBLIC_ERP_SPREADSHEET_ID }}
          NUXT_PUBLIC_ERP_ISSUE_SHEET_GID: ${{ secrets.NUXT_PUBLIC_ERP_ISSUE_SHEET_GID }}
        run: npm run generate

      - name: Write release marker
        run: |
          printf '%s\n' "$GITHUB_SHA" > .output/public/release.txt

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          test -f .output/public/release.txt
          test -f .output/public/api/.htaccess
          test "$(find .output/public -type l | wc -l)" -eq 0
          du -sh .output/public

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-static-site
          path: ./.output/public
          if-no-files-found: error
          retention-days: 7
          # Без этого upload-artifact@v4 молча выбрасывает точечные файлы, и
          # public/api/.htaccess никогда не доезжал до сервера. API продолжал
          # работать на старом .htaccess, залитом когда-то вручную, поэтому
          # пропажа ничем себя не проявляла — пока правка в .htaccess просто
          # не применилась на бою.
          include-hidden-files: true

  deploy:
    needs: [resolve-target, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: erp-deploy-${{ needs.resolve-target.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve-target.outputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: erp-static-site
          path: ./site

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure trusted SFTP host
        env:
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload static site without remote deletion
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_SERVER_DIR: ${{ vars.SFTP_SERVER_DIR }}
        run: |
          export SSHPASS="$SFTP_PASSWORD"
          sshpass -e scp -pr \
            -P "$SFTP_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            ./site/. "$SFTP_USERNAME@$SFTP_HOST:$SFTP_SERVER_DIR"

      # Выкладка прошла — но это не значит, что выложилось то, что нужно.
      # Скрытый .htaccess однажды уже потерялся по дороге, и заметили это
      # только вручную: сервер продолжал отвечать на старой копии.
      - name: Verify deployed site
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "DEPLOY_URL не задан — проверку выполнить нечем"
            exit 1
          fi
          base="${DEPLOY_URL%/}"

          echo "Выложенная ревизия:"
          actual=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$base/release.txt" | tr -d '[:space:]')
          echo "  ожидаем $EXPECTED_SHA"
          echo "  на сайте $actual"
          test "$actual" = "$EXPECTED_SHA"

          # Внутренности API не должны отдаваться наружу: под webroot лежат
          # исходники, миграции со схемой базы и зависимости.
          fail=0
          for path in api/composer.json api/src/Auth.php api/vendor/autoload.php api/.user.ini; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$path")
            echo "  $path -> $code"
            if [ "$code" != "404" ] && [ "$code" != "403" ]; then
              echo "    ДОСТУПНО НАРУЖУ"
              fail=1
            fi
          done
          # Репозиторий в этой job не выкачивается — имя миграции берём из
          # самого артефакта, который только что выложили.
          migration=$(ls -1 ./site/api/migrations 2>/dev/null | tail -1 || true)
          if [ -n "$migration" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/migrations/$migration")
            echo "  api/migrations/$migration -> $code"
            if [ "$code" != "404" ] && [ "$code" != "403" ]; then
              echo "    СХЕМА БАЗЫ ДОСТУПНА НАРУЖУ"
              fail=1
            fi
          fi
          exit $fail
